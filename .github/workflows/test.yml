name: Python Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Setup test data
        run: |
          mkdir -p tests/test_data/inputs
          cp -r examples/inputs/* tests/test_data/inputs/

      - name: Verify test data
        run: |
          ls -la tests/test_data/inputs/
          echo "Test data files:"
          find tests/test_data/inputs/ -type f -exec ls -lh {} \;

      - name: Run tests with pytest
        run: |
          uv run -m pytest -v tests/ --capture=no
